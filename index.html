<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Video</title>
  <style>
    * { margin: 0; padding: 0; }
    video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    body {
      background: black;
    }
  </style>
</head>
<body>
  <video autoplay muted playsinline loop>
    <source src="hacienda_noaudio.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
</body>
</html>
